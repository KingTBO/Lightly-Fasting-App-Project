<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lightly 轻伴</title>
<meta name="description" content="A fasting timer that follows the sky. Moon at night, sun by day, set by your real sunrise and sunset.">
<meta name="theme-color" content="#0E1430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lightly">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-startup-image" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width:420px) and (device-height:912px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1260x2736.png">
<link rel="apple-touch-startup-image" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="splash/1242x2688.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="ph" id="ph" data-sky="night">
  <svg class="stars" id="stars" viewBox="0 0 390 420" aria-hidden="true"></svg>

  <main class="scr on" id="today" aria-label="Today">
    <div class="nav">
      <div><span class="sub" id="sub"></span></div>
      <button class="chip" id="planBtn" type="button"><span id="planChip">16:8</span>
        <svg viewBox="0 0 12 8" width="10" height="7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5 6 6l4.5-4.5"/></svg></button>
    </div>
    <button class="offbar" id="offBar" type="button" data-act="timeoff" hidden></button>
    <div class="disc-wrap" id="discWrap">
      <div class="disc-box" id="discBox">
        <svg id="disc" viewBox="-118 -118 236 236" role="img" aria-label="Fast progress">
          <defs>
            <radialGradient id="gMoon" cx=".38" cy=".34" r=".78"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEE8D9"/><stop offset="1" stop-color="#CFC7B2"/></radialGradient>
            <radialGradient id="gSun" cx=".4" cy=".36" r=".78"><stop offset="0" stop-color="#FFF6C2"/><stop offset=".5" stop-color="#FFD21F"/><stop offset="1" stop-color="#F5A800"/></radialGradient>
            <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4"/></filter>
            <mask id="mLit" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><path id="lit" fill="#fff" filter="url(#soft)"/></mask>
          </defs>
          <circle id="unlit" r="84" style="fill:var(--unlit);stroke:var(--rim)" stroke-width="1.5"/>
          <g mask="url(#mLit)"><circle id="litMoon" r="84" fill="url(#gMoon)"/><circle id="litSun" r="84" fill="url(#gSun)" opacity="0"/></g>
        </svg>
      </div>
    </div>
    <div class="read">
      <div class="kline"><span class="k" id="readK"></span><span class="alt" id="readAlt"></span></div>
      <span class="big" id="readBig" role="timer" aria-live="off"></span>
      <p class="tip" id="readTip"></p>
    </div>
    <div class="track" id="track">
      <svg viewBox="0 0 342 64" aria-hidden="true">
        <path id="tLine" d="M8 52 Q171 4 334 52" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--unlit)"/>
        <path id="tDone" d="M8 52 Q171 4 334 52" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--ink)"/>
        <g id="ticks"></g>
        <circle id="marker" r="9" stroke-width="3" style="stroke:var(--sky);fill:var(--ink)"/>
      </svg>
      <div class="ends"><span id="endA"></span><span id="endB"></span></div>
    </div>
    <button class="streak" id="streakBtn" type="button"><span class="tx" id="streakTx"></span><span class="dots" id="streakDots" aria-hidden="true"></span></button>
    <div class="gap" id="gap"></div>
    <button class="act" id="act" type="button"><span id="actLbl">Start fast</span></button>
  </main>

  <section class="scr" id="days" aria-label="Days"></section>
  <section class="scr" id="me" aria-label="Me"></section>

  <nav class="tabs" id="tabs" aria-label="Tabs">
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <button type="button" data-tab="today" class="sel"><svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z"/></svg><svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span id="tabT">Today</span></button>
    <button type="button" data-tab="days"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg><span id="tabD">Days</span></button>
    <button type="button" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M6.2 18.6a6.5 6.5 0 0 1 11.6 0"/></svg><span id="tabM">Me</span></button>
  </nav>

  <div class="fabwrap"><button type="button" class="fab" id="dayFab" data-act="fab" aria-hidden="true" tabindex="-1"><svg class="fi-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><svg class="fi-add" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="ob" id="ob" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="color:#fff;padding:24px;font:17px sans-serif">Lightly needs JavaScript to run.</p></noscript>
<script src="js/sphere.js"></script>
<script src="js/core.js"></script>
<script src="js/version.js"></script>
<script src="js/import.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
