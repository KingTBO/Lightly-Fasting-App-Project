# Puts a version tag and a GitHub Release (notes from CHANGELOG.md) on GitHub for every version.
#  - Each push to main: if js/version.js names a version that has no tag yet, tag that commit as v<version>.
#  - Also creates any tag still missing from scripts/version-tags.tsv (the history from v0.1.0 on).
# Existing tags are never moved or deleted. Nothing here uses a secret; it uses the workflow's own token.
name: Version tags
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: version-tags
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing version tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1. history: every version listed in scripts/version-tags.tsv
          grep -v '^#' scripts/version-tags.tsv | while IFS="$(printf '\t')" read -r v sha cat; do
            [ -n "$v" ] || continue
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then continue; fi
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then echo "skip v$v: commit $sha not found"; continue; fi
            git tag -a "v$v" -m "v$v $cat" "$sha"
            echo "tagged v$v at $sha"
          done
          # 2. this push: the version in js/version.js
          v=$(sed -n "s/.*LIGHTLY_VERSION *= *'\([0-9][0-9.]*\)'.*/\1/p" js/version.js)
          if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            git tag -a "v$v" -m "v$v $(git log -1 --format=%s "$GITHUB_SHA" | sed -n 's/^\([a-z]*\):.*/\1/p')" "$GITHUB_SHA"
            echo "tagged v$v at $GITHUB_SHA"
          fi
          git push origin --tags
      - name: Create missing GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # oldest first, so the Releases page lists the newest version on top
          cur=$(sed -n "s/.*LIGHTLY_VERSION *= *'\([0-9][0-9.]*\)'.*/\1/p" js/version.js)
          for tag in $(git tag --list 'v*' | sort -V); do
            v=${tag#v}
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            sh scripts/release-notes.sh "$v" > "$RUNNER_TEMP/notes.md"
            if [ "$v" = "$cur" ]; then latest="--latest"; else latest="--latest=false"; fi
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" $latest
            echo "released $tag"
            sleep 1
          done
